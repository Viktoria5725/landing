<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Travel Explorer</title>
  <meta name="description" content="Discover amazing destinations around the world.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="banner">
        <div class="container">
        <h1>Travel Explorer</h1>
        <h2>Discover the world, one trip at a time.</h2>
        <a href="#destinations" class="btn-blue">Explore now</a>
        </div>
    </div>

    <div class="container" id="destinations">
        <h2>Discover your next adventure</h2>
        <p>Find beautiful places and plan your next trip.</p>

        <h1 class="page-title">Travel Explorer</h1>

        <button class="shout-button btn-blue">Say hello</button>

        <p>Contact us: <span class="email">hello@travelexplorer.com</span></p>

        <button class="copy-email btn-blue">Copy email</button>

        <h2>Our community</h2>
        <img src="images/avatar.avif" alt="Profile picture" class="avatar">
    </div>

    <div class="container">
        <div class="cards">

        <div class="card">
            <img src="images/paris.avif" alt="paris">
            <h3>Paris</h3>
        </div>

        <div class="card">
            <img src="images/london.avif" alt="london">
            <h3>London</h3>
        </div>

        <div class="card">
            <img src="images/rome.avif" alt="rome">
            <h3>Rome</h3>
        </div>

        <div class="card">
            <img src="images/barcelona.jpg" alt="Barcelona">
            <h3>Barcelona</h3>
        </div>

        </div>
    </div>

    <div class="container">
        <h2>Plan your next trip</h2>
        <div data-tf-live="01M5S4TCRNVX4D2GJZXRY13KPH"></div>
    </div>

    <script src="https://embed.typeform.com/next/embed.js"></script>
    <script src="behavior.js"></script>

</body>
</html>
